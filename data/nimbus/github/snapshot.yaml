files:
  - path: README.md
    last_author: aarav-m
    updated_at: 2026-09-22T18:10:00+05:30
    content: |
      # Nimbus 2027 — fest app

      The official app for **Nimbus**, the annual tech fest of Vidyanagar Institute of Technology.
      Fest dates: **16–18 January 2027**.

      ## What it does

      - Registration and ticket payments (Razorpay, UPI)
      - Event schedule and venue map
      - QR tickets and check-in at the gates
      - Announcements
      - Sponsor showcase

      ## Stack

      | Part | Choice |
      |---|---|
      | Frontend | Next.js PWA on Vercel |
      | Auth | Firebase Auth (Google sign-in + email link) |
      | API | Express on Railway |
      | Database | Supabase Postgres |
      | Email | Resend |
      | Images | Cloudinary |
      | Errors | Sentry |

      There is no native Android app. The PWA is the app.

      ## Running locally

      ```bash
      cp .env.example .env   # ask Aarav for the values
      npm install
      npm run dev            # web on :3000, API on :4000
      ```

      ## Backups

      A GitHub Action takes a nightly `pg_dump` of the Supabase database and uploads it to the
      club's Google Drive, using a Drive service account key stored as the `GDRIVE_SA_KEY` secret.

      ## Who to ask

      - Auth, payments, admin dashboard, backups: Aarav (@aarav-m)
      - Check-in scanner, sponsor page, Cloudinary: Sneha (@sneha-k)
      - Schedule, notifications, email: Dev (@dev-p)
      - Deploys, Sentry: Kabir (@kabir-s)

  - path: docs/architecture.md
    last_author: aarav-m
    updated_at: 2026-09-19T21:40:00+05:30
    content: |
      # Architecture notes

      ## Database

      Registrations, payments and check-ins live in **Supabase Postgres**. We prototyped on
      Firestore in July and moved because the treasurer needs SQL exports for the college audit,
      and Firestore exports were painful.

      ## Time

      All timestamps are stored in UTC and shown in IST (Asia/Kolkata). Don't store local time.

      ## Tickets and check-in

      Each paid registration gets a QR code containing an HMAC-SHA256 signed token
      (registration id + event id + expiry). The scanner calls `POST /checkin` and the API checks
      the signature with `TICKET_SIGNING_SECRET`. We don't put plain registration IDs in the QR,
      because anyone with a screenshot of someone else's ID could forge a ticket.

      ## Admin dashboard

      `/admin` is only for the core committee. Access is a Firebase custom claim `role=core`,
      set with `scripts/set-claims.js`.

  - path: docs/deploy.md
    last_author: kabir-s
    updated_at: 2026-10-05T12:00:00+05:30
    content: |
      # Deploying

      ## Web

      Vercel, project `nimbus-app`. Every push to `main` deploys. The web app finds the API through
      `NEXT_PUBLIC_API_URL`.

      ## API

      Railway, service `nimbus-api`, Hobby plan ($5/month). We moved here from Render on 3 Oct.
      Billing is on Aarav's card for now.

      ## Domain and DNS

      `nimbusfest.in` is registered at GoDaddy. Renewal is due on **2 Dec 2026**.
      Resend needs its DNS records (SPF, DKIM) on this domain for email to deliver properly.

      ## Environment variables

      | Name | Where | Notes |
      |---|---|---|
      | `DATABASE_URL` | Railway | Supabase connection string |
      | `RAZORPAY_KEY_ID` / `RAZORPAY_KEY_SECRET` | Railway | Live keys |
      | `TICKET_SIGNING_SECRET` | Railway | Do not rotate before the fest |
      | `RESEND_API_KEY` | Railway | |
      | `SENTRY_DSN` | Vercel + Railway | |

