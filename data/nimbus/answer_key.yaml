# Project Nimbus — answer key
#
# Everything planted in the synthetic dataset, and where. Used by the eval
# harness (Phase 4) to score the agents. `in` lists source keys from
# manifest.yaml plus a phrase that appears in the cited item.
#
# All people, companies, numbers and "secrets" here are made up.

decisions:
  - id: D01
    statement: Login uses Firebase Auth with Google sign-in and email links.
    why: Every student already has a college Google account; email link covers the rest.
    in: [[repo, "Add Firebase Auth"], [repo, "college Google account"]]
  - id: D02
    statement: Registrations live in Supabase Postgres instead of Firestore.
    why: The treasurer needs SQL exports for the college audit.
    in: [[repo, "Supabase Postgres"], [notes, "SQL exports"]]
  - id: D03
    statement: Ticket payments go through Razorpay.
    why: UPI support, low fees, and KYC through the club's bank account.
    in: [[notes, "Razorpay"]]
  - id: D04
    statement: Payment confirmation comes from the Razorpay payment.captured webhook.
    reversed_by: D05
    in: [[repo, "payment.captured"]]
  - id: D05
    statement: Payments are confirmed by polling the Razorpay Orders API from the return page, plus a nightly reconciliation job; webhooks were dropped.
    why: Webhooks kept failing on campus Wi-Fi (ngrok drops, college firewall blocks inbound).
    in: [[repo, "Poll Razorpay orders"], [dev, "Switching to polling"], [notes, "polling"]]
  - id: D06
    statement: The API is hosted on Render's free tier.
    reversed_by: D07
    in: [[repo, "Render free tier"]]
  - id: D07
    statement: The API moved from Render to Railway's Hobby plan.
    why: Render cold starts made the first check-in request take about 50 seconds.
    in: [[repo, "Move API from Render to Railway"], [dev, "cold start"], [notes, "Railway"]]
  - id: D08
    statement: The frontend is a Next.js PWA hosted on Vercel.
    in: [[repo, "Vercel"]]
  - id: D09
    statement: QR tickets carry HMAC-signed tokens rather than plain registration IDs.
    why: Plain IDs could be forged from screenshots.
    in: [[repo, "Signed QR"], [repo, "screenshot"]]
  - id: D10
    statement: The event schedule is stored as JSON in the repo (src/data/schedule.json).
    reversed_by: D11
    in: [[repo, "schedule.json"]]
  - id: D11
    statement: The schedule is read from a published Google Sheet CSV every 10 minutes.
    why: The events committee can edit it without a deploy.
    in: [[repo, "Google Sheet"], [notes, "Google Sheet"]]
  - id: D12
    statement: Announcements are sent as FCM push notifications to everyone.
    reversed_by: D13
    in: [[repo, "FCM push"]]
  - id: D13
    statement: iOS push is dropped; announcements go by email and WhatsApp broadcast, FCM stays for Android.
    why: iOS only delivers PWA push after "Add to Home Screen", which almost nobody does.
    in: [[repo, "iOS PWA push"], [dev, "iOS push is dead"], [notes, "WhatsApp broadcast"]]
  - id: D14
    statement: The leaderboard feature is cut.
    reversed_by: D15
    in: [[notes, "Leaderboard is cut"]]
  - id: D15
    statement: A "lite" leaderboard, regenerated hourly, is back in scope.
    why: Zentrix, the title sponsor, asked for it.
    in: [[notes, "leaderboard lite"], [repo, "Leaderboard lite"], [core, "want the leaderboard back"]]
  - id: D16
    statement: Transactional email goes through Resend instead of Gmail SMTP.
    why: Gmail caps sending at about 500 a day.
    in: [[repo, "Resend"]]
  - id: D17
    statement: Event posters are stored on Cloudinary.
    in: [[repo, "Cloudinary"]]
    note: No reason is recorded anywhere (see M03).
  - id: D18
    statement: The admin dashboard is limited to users with the Firebase custom claim role=core.
    in: [[repo, "role=core"]]
  - id: D19
    statement: /register is rate-limited to 10 requests a minute per IP.
    why: Bot sign-ups on 2 Oct.
    in: [[repo, "Rate-limit /register"], [repo, "Bot sign-ups"]]
  - id: D20
    statement: Early-bird tickets cost ₹199 until 31 Dec, then ₹299.
    in: [[notes, "₹199"]]
    conflicts: C1
  - id: D21
    statement: Times are stored in UTC and shown in IST.
    in: [[repo, "UTC"]]
  - id: D22
    statement: No native Android app; the PWA is the only app.
    in: [[notes, "PWA only"]]
  - id: D23
    statement: Feature freeze on 5 Jan 2027.
    in: [[notes, "Feature freeze"], [board, "Feature freeze"]]
  - id: D24
    statement: A GitHub Action takes a nightly pg_dump to the club's Google Drive.
    in: [[repo, "pg_dump"]]
    conflicts: C6
  - id: D25
    statement: The free pass allows at most 3 events per student.
    in: [[notes, "3 events"]]
    conflicts: C4

