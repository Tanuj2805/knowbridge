name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API tests (incl. secret and permission trap tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: knowbridge
          POSTGRES_PASSWORD: knowbridge
          POSTGRES_DB: knowbridge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U knowbridge"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://knowbridge:knowbridge@localhost:5432/knowbridge
      KB_REAL_MODEL: "1"           # run search-quality tests with the real embedding model
      MODEL_CACHE_DIR: /home/runner/kb-models
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: pip install -e ".[dev,local-search]"
      - name: Cache the embedding model (~1 GB, downloaded once)
        uses: actions/cache@v4
        with:
          path: /home/runner/kb-models
          key: embed-paraphrase-multilingual-mpnet-base-v2-v1
      - run: ruff check app tests
      - run: pytest -q

  web:
    name: Web typecheck and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
